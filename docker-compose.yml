version: '3.8'

services:
  api:
    build: .
    container_name: quartz-api
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - rabbitmq
  
  worker:
    build: .
    container_name: quartz-worker
    restart: unless-stopped
    command: celery -A async_queue.config.app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - mongodb
      - rabbitmq

  mongodb:
    image: mongo:6.0
    container_name: quartz-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  rabbitmq:
    image: rabbitmq:3-management
    container_name: quartz-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

networks:
  default:
    driver: bridge
